<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>word预览</title>
</head>
<body>
    <!-- 使用iframe和Office提供的预览服务-->

<div class="root" id="root">
    
    <!-- <iframe src='https://view.officeapps.live.com/op/view.aspx?src=http%3A%2F%2Fteacher.91yixi.com%2FW008%2F1.xls' width='100%' height='100%' frameborder='1'></iframe>
     -->
</div>
    <script>
        //Word 文件预览通常比较复杂，因为浏览器并不能直接染Word 文件。一个常见的做法是将 Word 文件转换成 PDF或者HTML格式后再进行预览，但这通常需要服务器端的支持。对于纯客户端实现，我们可以考虑利用 Microsoft Office 提供的在线预览服务:
        //请注意，上述方法要求您的 Word 文件 URL是公开可访问的,因为 Microsoft 的服务需要从 URL 直接读取文件。

        window.onload=function(){
            // var frame = document.getElementById('frame');
            // let url='http://39.104.76.6:8099/kb/download?url=http://115.190.113.86/v1/file/get/277a817c6dec11f0834a0242ac120003&fileName=5Luj55CG57O757uf5pWw5o2uQVBJLmRvY3g%3D'
            // let src='https://view.officeapps.live.com/op/view.aspx?src='+`http://192.168.0.29:8099/file/proxyOther?fileUrl=http://115.190.113.86/v1/document/get/277a817c6dec11f0834a0242ac120003&suffix=docx`
            // frame.setAttribute('src',)

            let root=document.getElementById('root')
            root.innerHTML=`
                <iframe src='https://view.officeapps.live.com/op/view.aspx?src=${encodeURIComponent('http://192.168.1.101:8011/upload/a.doc')}' width='100%' height='100%' frameborder='1'>
                </iframe>
            `
        }
    </script>
</body>
</html>
