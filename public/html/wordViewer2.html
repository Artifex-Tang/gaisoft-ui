<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线Word文档预览工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin-top: 30px;
        }
        
        header {
            background: linear-gradient(90deg, #4b6cb7 0%, #182848 100%);
            color: white;
            padding: 25px 30px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        h1 i {
            font-size: 2.2rem;
        }
        
        .subtitle {
            font-weight: 300;
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .main-content {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        .input-section {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        
        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e1e5f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        input:focus {
            border-color: #4b6cb7;
            outline: none;
            box-shadow: 0 0 0 3px rgba(75, 108, 183, 0.2);
        }
        
        button {
            background: linear-gradient(90deg, #4b6cb7 0%, #3a56a0 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(75, 108, 183, 0.3);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(75, 108, 183, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .preview-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #4b6cb7;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .preview-container {
            background: #f8f9ff;
            border-radius: 10px;
            overflow: hidden;
            height: 600px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid #e1e5f0;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .sample-files {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }
        
        .sample-file {
            background: linear-gradient(90deg, #eef2f8 0%, #dce4f1 100%);
            border-radius: 8px;
            padding: 15px 20px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #e1e5f0;
            flex: 1;
            min-width: 200px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .sample-file:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            background: linear-gradient(90deg, #e1e8f5 0%, #d0d9ea 100%);
        }
        
        .sample-file i {
            color: #4b6cb7;
            font-size: 1.2rem;
        }
        
        .instructions {
            background: #f0f4ff;
            border-left: 4px solid #4b6cb7;
            padding: 20px;
            border-radius: 0 8px 8px 0;
            margin-top: 20px;
        }
        
        .instructions h3 {
            color: #4b6cb7;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .instructions ul {
            padding-left: 20px;
        }
        
        .instructions li {
            margin-bottom: 8px;
            line-height: 1.5;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #6c757d;
            font-size: 0.9rem;
            margin-top: 20px;
        }
        
        @media (max-width: 768px) {
            .input-group {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .preview-container {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-file-word"></i> Word文档在线预览工具</h1>
            <p class="subtitle">直接通过URL预览服务器上的Word文档</p>
        </header>
        
        <div class="main-content">
            <div class="input-section">
                <h2 class="section-header"><i class="fas fa-link"></i> 输入文档URL</h2>
                <div class="input-group">
                    <input type="url" id="docUrl" placeholder="输入Word文档的完整URL (例如: https://yourserver.com/docs/report.docx)" value="https://calibre-ebook.com/downloads/demos/demo.docx">
                    <button id="previewBtn"><i class="fas fa-eye"></i> 预览文档</button>
                </div>
                
                <div class="instructions">
                    <h3><i class="fas fa-info-circle"></i> 使用说明</h3>
                    <ul>
                        <li>确保Word文档URL是公开可访问的</li>
                        <li>支持 .doc 和 .docx 格式的文件</li>
                        <li>文档通过微软Office Online服务进行预览</li>
                        <li>如果文档无法加载，请检查URL是否正确</li>
                    </ul>
                </div>
                
                <h3 style="margin-top: 20px; color: #4b6cb7;"><i class="fas fa-file-download"></i> 示例文档</h3>
                <div class="sample-files">
                    <div class="sample-file" data-url="https://calibre-ebook.com/downloads/demos/demo.docx">
                        <i class="fas fa-file-word"></i>
                        <span>示例文档1 - 产品说明文档</span>
                    </div>
                    <div class="sample-file" data-url="https://www.africau.edu/images/default/sample.docx">
                        <i class="fas fa-file-word"></i>
                        <span>示例文档2 - 简单示例文档</span>
                    </div>
                    <div class="sample-file" data-url="https://file-examples.com/storage/feaad08bfb647856f96de39/2017/02/file-sample_100kB.docx">
                        <i class="fas fa-file-word"></i>
                        <span>示例文档3 - 100kB测试文档</span>
                    </div>
                </div>
            </div>
            
            <div class="preview-section">
                <h2 class="section-header"><i class="fas fa-desktop"></i> 文档预览</h2>
                <div class="preview-container">
                    <iframe id="previewFrame" src="https://view.officeapps.live.com/op/embed.aspx?src=https://calibre-ebook.com/downloads/demos/demo.docx"></iframe>
                </div>
            </div>
        </div>
        
        <footer>
            <p>© 2023 Word文档预览工具 | 使用微软Office Online服务</p>
            <p>注意：此工具仅用于预览公开可访问的Word文档</p>
        </footer>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const docUrlInput = document.getElementById('docUrl');
            const previewBtn = document.getElementById('previewBtn');
            const previewFrame = document.getElementById('previewFrame');
            const sampleFiles = document.querySelectorAll('.sample-file');
            
            // 预览按钮事件
            previewBtn.addEventListener('click', function() {
                const url = docUrlInput.value.trim();
                if(url) {
                    previewDocument(url);
                } else {
                    alert('请输入有效的文档URL');
                }
            });
            
            // 示例文档点击事件
            sampleFiles.forEach(file => {
                file.addEventListener('click', function() {
                    const url = this.getAttribute('data-url');
                    docUrlInput.value = url;
                    previewDocument(url);
                });
            });
            
            // 预览文档函数
            function previewDocument(url) {
                // 验证URL是否以支持的扩展名结尾
                // const validExtensions = ['.doc', '.docx'];
                // const isValid = validExtensions.some(ext => url.toLowerCase().endsWith(ext));
                
                // if(!isValid) {
                //     alert('请输入有效的Word文档URL（以.doc或.docx结尾）');
                //     return;
                // }
                
                // 使用微软Office Online预览服务
                const previewUrl = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(url)}`;
                previewFrame.src = previewUrl;
            }
            
            // 初始化默认预览
            previewDocument('https://calibre-ebook.com/downloads/demos/demo.docx');
        });
    </script>
</body>
</html>
